AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GameLift compute tier: build reference, managed EC2 fleet, alias, and a
  session-placement queue. The game-server binary is uploaded out-of-band with
  `aws gamelift upload-build`; the resulting BuildId is passed in as a parameter
  so this template stays declarative.

Parameters:
  EnvName:
    Type: String
  BuildId:
    Type: String
    Description: GameLift build id from `aws gamelift upload-build`.
  ServerPort:
    Type: Number
    Default: 3001
  FleetInstanceType:
    Type: String
    Default: c5.large
  MinSize:
    Type: Number
    Default: 0
  MaxSize:
    Type: Number
    Default: 2
  DesiredInstances:
    Type: Number
    Default: 1

Resources:
  Fleet:
    Type: AWS::GameLift::Fleet
    Properties:
      Name: !Sub 'racer-${EnvName}-fleet'
      BuildId: !Ref BuildId
      EC2InstanceType: !Ref FleetInstanceType
      FleetType: ON_DEMAND
      DesiredEC2Instances: !Ref DesiredInstances
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      RuntimeConfiguration:
        ServerProcesses:
          # Run several server processes per instance, one per match.
          - LaunchPath: /local/game/dist/index.js
            Parameters: !Sub '--port ${ServerPort}'
            ConcurrentExecutions: 4
      EC2InboundPermissions:
        - FromPort: !Ref ServerPort
          ToPort: !Ref ServerPort
          IpRange: 0.0.0.0/0
          Protocol: TCP

  FleetAlias:
    Type: AWS::GameLift::Alias
    Properties:
      Name: !Sub 'racer-${EnvName}-alias'
      RoutingStrategy:
        Type: SIMPLE
        FleetId: !Ref Fleet

  SessionQueue:
    Type: AWS::GameLift::GameSessionQueue
    Properties:
      Name: !Sub 'racer-${EnvName}-queue'
      TimeoutInSeconds: 60
      Destinations:
        - DestinationArn: !Sub 'arn:aws:gamelift:${AWS::Region}:${AWS::AccountId}:alias/${FleetAlias}'

Outputs:
  FleetId:
    Value: !Ref Fleet
  AliasId:
    Value: !Ref FleetAlias
  QueueArn:
    Value: !Sub 'arn:aws:gamelift:${AWS::Region}:${AWS::AccountId}:gamesessionqueue/racer-${EnvName}-queue'
