AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Root stack for Living-Room Racer. Nests the tier stacks and wires cross-stack
  values via nested-stack outputs. `aws cloudformation package` uploads the
  nested templates (and SAM Lambda code) and rewrites the local paths below to
  S3 URLs, producing root.packaged.yaml which is what actually gets deployed.

Parameters:
  EnvName:
    Type: String
    Default: dev
  GameServerImageUri:
    Type: String
    Default: ''
    Description: >
      ECR image URI for the game server container (built by the deploy scripts).
      Leave empty to skip the GameLift + matchmaking stacks and deploy everything
      else; set it to enable hosted game servers on a managed container fleet.

Conditions:
  # Only create the GameLift container fleet + FlexMatch once an image exists.
  # Referencing a missing image would fail validation and roll back the stack.
  HasGameLiftBuild: !Not [!Equals [!Ref GameServerImageUri, '']]

Resources:
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./data.yaml
      Parameters:
        EnvName: !Ref EnvName

  IdentityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./identity.yaml
      Parameters:
        EnvName: !Ref EnvName

  GameLiftStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasGameLiftBuild
    Properties:
      TemplateURL: ./gamelift.yaml
      Parameters:
        EnvName: !Ref EnvName
        GameServerImageUri: !Ref GameServerImageUri

  MatchmakingStack:
    Type: AWS::CloudFormation::Stack
    Condition: HasGameLiftBuild
    DependsOn: GameLiftStack
    Properties:
      TemplateURL: ./matchmaking.yaml
      Parameters:
        EnvName: !Ref EnvName
        GameSessionQueueArn: !GetAtt GameLiftStack.Outputs.QueueArn

  ApiStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - DataStack
      - IdentityStack
    Properties:
      TemplateURL: ./api.yaml
      Parameters:
        EnvName: !Ref EnvName
        UserPoolId: !GetAtt IdentityStack.Outputs.UserPoolId
        PlayersTableName: !GetAtt DataStack.Outputs.PlayersTableName
        LeaderboardsTableName: !GetAtt DataStack.Outputs.LeaderboardsTableName
        # Empty when GameLift is skipped; the matchmaking Lambda treats that as
        # "matchmaking not configured" and returns a clear error.
        MatchmakingConfigName: !If
          - HasGameLiftBuild
          - !GetAtt MatchmakingStack.Outputs.MatchmakingConfigName
          - ''

  WebStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./web.yaml
      Parameters:
        EnvName: !Ref EnvName

  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./observability.yaml
      Parameters:
        EnvName: !Ref EnvName

Outputs:
  ApiUrl:
    Value: !GetAtt ApiStack.Outputs.ApiUrl
  UserPoolId:
    Value: !GetAtt IdentityStack.Outputs.UserPoolId
  UserPoolClientId:
    Value: !GetAtt IdentityStack.Outputs.UserPoolClientId
  IdentityPoolId:
    Value: !GetAtt IdentityStack.Outputs.IdentityPoolId
  MatchmakingConfigName:
    Condition: HasGameLiftBuild
    Value: !GetAtt MatchmakingStack.Outputs.MatchmakingConfigName
  WebDistributionDomain:
    Value: !GetAtt WebStack.Outputs.DistributionDomain
  WebBucketName:
    Value: !GetAtt WebStack.Outputs.SiteBucketName
  WebDistributionId:
    Value: !GetAtt WebStack.Outputs.DistributionId
