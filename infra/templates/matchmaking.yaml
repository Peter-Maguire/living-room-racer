AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GameLift FlexMatch: matchmaking rule set and configuration. Groups 1-8 players
  into a single "racers" team, then routes accepted matches to the GameLift queue.

Parameters:
  EnvName:
    Type: String
  GameSessionQueueArn:
    Type: String
    Description: ARN of the GameLift queue that hosts matched sessions.
  AcceptanceRequired:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  RuleSetVersion:
    Type: Number
    Default: 2
    Description: >
      Bump this whenever RuleSetBody changes. Rule set bodies are IMMUTABLE, so a
      body change forces resource replacement -- and CloudFormation refuses to
      replace a custom-named resource. Versioning the name sidesteps that.

Resources:
  RuleSet:
    Type: AWS::GameLift::MatchmakingRuleSet
    Properties:
      Name: !Sub 'racer-${EnvName}-ruleset-v${RuleSetVersion}'
      # NOTE on two deliberate choices here:
      #
      # 1. No `latency` rule. A latency rule can only place players who report
      #    LatencyInMs for a region; any player without latency data is
      #    unplaceable and the ticket TIMES OUT. This deployment is single-region,
      #    so the rule added failure risk for no benefit. Reinstate it (and have
      #    the client send latencyMs) when running multi-region.
      #
      # 2. minPlayers starts at 2 but EXPANDS down to 1 after 15s. Without this,
      #    a lone player can never be matched and always times out. With it,
      #    players who queue together still get grouped into one race, while a
      #    solo player falls back to a single-player race instead of failing.
      RuleSetBody: |
        {
          "name": "racer_ruleset",
          "ruleLanguageVersion": "1.0",
          "teams": [
            { "name": "racers", "minPlayers": 2, "maxPlayers": 8 }
          ],
          "rules": [],
          "expansions": [
            {
              "target": "teams[racers].minPlayers",
              "steps": [
                { "waitTimeSeconds": 15, "value": 1 }
              ]
            }
          ]
        }

  MatchmakingConfig:
    Type: AWS::GameLift::MatchmakingConfiguration
    Properties:
      Name: !Sub 'racer-${EnvName}-matchmaking'
      RuleSetName: !Ref RuleSet
      RequestTimeoutSeconds: 60
      AcceptanceRequired: !Ref AcceptanceRequired
      GameSessionQueueArns:
        - !Ref GameSessionQueueArn
      BackfillMode: MANUAL
      FlexMatchMode: WITH_QUEUE

Outputs:
  MatchmakingConfigName:
    Value: !Ref MatchmakingConfig
  RuleSetName:
    Value: !Ref RuleSet
